name: Verify accounting harness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify plan and accounting reference example
        run: python3 scripts/verify_foundation.py
      - name: Run application tests with discovery guard
        run: python3 scripts/run_tests.py
      - name: Demonstrate exact money and the account catalog
        run: python3 -m accounting_harness demo-accounts
      - name: Demonstrate journal validation
        run: python3 -m accounting_harness demo-journal
      - name: Demonstrate ledger and trial balance
        run: python3 -m accounting_harness demo-ledger
      - name: Demonstrate atomic persistence and safe retry
        run: python3 -m accounting_harness demo-persistence
      - name: Demonstrate linked reversals and preserved history
        run: python3 -m accounting_harness demo-reversal
      - name: Demonstrate source registration and repeat imports
        run: python3 -m accounting_harness demo-source
      - name: Demonstrate draft revisions and review findings
        run: python3 -m accounting_harness demo-review
      - name: Demonstrate approval binding and atomic posting
        run: python3 -m accounting_harness demo-approval
      - name: Demonstrate typed tools and offline contract cases
        run: python3 -m accounting_harness demo-tools
      - name: Demonstrate resumable bounded fake-provider run
        run: python3 -m accounting_harness demo-run
      - name: Demonstrate bounded provider adapter and offline proposal gate
        run: python3 -m accounting_harness demo-provider
      - name: Demonstrate persistent offline localhost workspace
        run: python3 -m accounting_harness demo-web
      - name: Demonstrate additive evidence enrollment and preserved approvals
        run: python3 -m accounting_harness demo-enrollment
      - name: Demonstrate reviewed cash recognition with paired evidence
        run: python3 -m accounting_harness demo-cash
      - name: Demonstrate reviewed vendor bill and payable reconciliation
        run: python3 -m accounting_harness demo-bill
      - name: Demonstrate recorded partial vendor settlement
        run: python3 -m accounting_harness demo-bill-payment
      - name: Demonstrate reviewed customer invoice and receivable reconciliation
        run: python3 -m accounting_harness demo-invoice
      - name: Demonstrate recorded invoice collection and captured aging
        run: python3 -m accounting_harness demo-collection
      - name: Demonstrate reviewed customer advance and liability control
        run: python3 -m accounting_harness demo-advance
      - name: Demonstrate separately supported advance earning
        run: python3 -m accounting_harness demo-advance-earning
